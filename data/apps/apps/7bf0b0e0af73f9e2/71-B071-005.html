<div class="m"><span class="bd">5）喜欢保持私密</span></div>
<div class="m">欧洲人保护自己的隐私并不意味着不友善。例如，他们喜欢独自坐在公交车上，在办公室关上门，许多人不想在街上被不认识的人搭讪。在彼此交往时，他们会保持友好的距离。这就是为什么你不太可能被邻居或熟人立即邀请回家的原因。</div>
<div class="m">同样，通常情况下，您不会突然造访朋友或熟人的家；通常情况下，您需要提前预约或打电话告知对方，以了解朋友或熟人是否可以或是否愿意接待您。</div>
<div class="m">父母也希望孩子有这样的隐私。通常不会给邻居家的孩子糖果或触摸他们。最好事先问问父母什么是可以的。</div>
</div>

<script>
var coll = document.getElementsByClassName("collapsible-button");
var i;

for (i = 0; i < coll.length; i++) {
    coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.maxHeight){
            content.style.maxHeight = null;
        } else {
            content.style.maxHeight = content.scrollHeight + "px";
        }
    });
}
