<div class="m"><span class="bd">7）道路交通</span></div>
<div class="m">在欧洲，人们遵守交通规则。这对大多数人来说非常重要。如果你驾驶不当，你可能会面临高额罚款或引发事故的风险。</div>
<div class="m">如果没有其他标志，通常适用以下规定：如果您从右侧驶来，您有优先通行权。禁止司机在开车时打手机。每个人都必须系好安全带。十二岁以下或身高不超过 150 厘米的儿童需要使用适合其年龄的专用儿童座椅，否则不允许他们乘坐汽车。</div>
<div class="m">遵守交通规则不仅是汽车驾驶员的责任，也是所有道路使用者的责任：所有类型的车辆，无论是否机动，包括带动物行驶的车辆或步行的车辆。</div>
</div>

<script>
var coll = document.getElementsByClassName("collapsible-button");
var i;

for (i = 0; i < coll.length; i++) {
    coll[i].addEventListener("click", function() {
        this.classList.toggle("active");
        var content = this.nextElementSibling;
        if (content.style.maxHeight){
            content.style.maxHeight = null;
        } else {
            content.style.maxHeight = content.scrollHeight + "px";
        }
    });
}
