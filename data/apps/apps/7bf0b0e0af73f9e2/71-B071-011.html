<div class="m"><span class="bd">11）复活节：罪恶与死亡被征服</span></div>
<div class="m">复活节是基督教最重要的节日，因为它提醒我们基督教信仰最重要的信息：耶稣，上帝派来的弥赛亚、救世主和主，死而复活，一劳永逸地战胜了罪恶和死亡。耶稣为我们每个人付出了赎金，使我们摆脱了罪恶，因为人类自己无法做到这一点。一旦人类接受了这一点，他就能与上帝和平相处，死后仍与他同在。复活节是在春天庆祝的，大自然在冬天过后苏醒，万物重新变绿。这是耶稣和他复活的标志。</div>
