<div class="m"><span class="bd">12）五旬节：圣灵降临，教会诞生</span></div>
<div class="m">耶稣复活后，他与门徒们进行了多次交谈，他们看到他确实又活了过来。不久之后，耶稣回到了天堂。门徒们继续定期聚会祈祷。在一次聚会中，房间里突然响起巨大的喧嚣声，一个燃烧的东西降落在每个人身上。门徒们充满了圣灵。这也表明他们突然能够说不同的语言，而来自不同国家的城里人都能听懂他们的话。圣经记载，当天约有 3,000 人开始信仰耶稣并加入基督教。五旬节就是为了纪念圣灵的降临和基督教会的诞生。</div>
